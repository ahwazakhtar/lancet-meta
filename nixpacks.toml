# Nixpacks build config for Railway.
# We only need the web app's runtime dependencies in production; the local
# extraction pipeline (Claude Agent SDK, pdfplumber, openpyxl) is kept light
# but isn't required for serving the UI.

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -e ."]

[start]
cmd = "uvicorn webapp.main:app --host 0.0.0.0 --port $PORT"
