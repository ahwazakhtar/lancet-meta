[project]
name = "lancet-meta"
version = "0.1.0"
description = "PDF -> structured extraction pipeline + review web app for the Lancet gun-violence meta-analysis"
requires-python = ">=3.11"
dependencies = [
    # Extraction pipeline
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # Google Sheets
    "gspread>=6.1",
    "google-auth>=2.30",
    # Web app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
lancet-extract = "extraction.cli:app"
lancet-web = "webapp.main:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extraction*", "webapp*"]

[tool.ruff]
line-length = 100
target-version = "py311"
