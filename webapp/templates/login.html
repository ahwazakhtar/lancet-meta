{% extends "base.html" %}
{% block title %}Sign in · Lancet Meta Review{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 4rem auto;">
  <hgroup>
    <h2>Sign in</h2>
    <p>Reviewer access required.</p>
  </hgroup>
  {% if error %}
    <p style="color: var(--pico-color-red-500);">Invalid username or password.</p>
  {% endif %}
  <form method="post" action="/login">
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</article>
{% endblock %}
