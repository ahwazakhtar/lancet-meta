{% extends "base.html" %}
{% block title %}Papers · Lancet Meta Review{% endblock %}
{% block content %}

{% if msg %}<p class="msg-success">{{ msg }}</p>{% endif %}
{% if err %}<p class="msg-error">{{ err }}</p>{% endif %}

<div class="page-head">
  <hgroup>
    <h2>Papers</h2>
    <p>{{ papers|length }} paper(s) visible. Check out a paper to start a draft only you can see.</p>
  </hgroup>
  <form method="post" action="/refresh-from-sheet"
        onsubmit="return confirm('Refresh papers from the Google Sheet?\n\nThis replaces every paper EXCEPT any that someone has checked out.');">
    <button type="submit" class="outline">↻ Refresh from Sheet</button>
  </form>
</div>

<form method="get" action="/" role="search" class="filter-bar">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by unique ID, authors, intervention, title…">
  <select name="status_filter">
    <option value="">All papers</option>
    <option value="modified" {% if status_filter == 'modified' %}selected{% endif %}>Edited only</option>
    <option value="needs_reextraction" {% if status_filter == 'needs_reextraction' %}selected{% endif %}>Needs re-extraction</option>
  </select>
  <select name="checkout_filter">
    <option value="">Any checkout state</option>
    <option value="mine" {% if checkout_filter == 'mine' %}selected{% endif %}>Checked out by me</option>
    <option value="held" {% if checkout_filter == 'held' %}selected{% endif %}>Checked out (anyone)</option>
    <option value="available" {% if checkout_filter == 'available' %}selected{% endif %}>Available</option>
  </select>
  <button type="submit">Filter</button>
</form>

<figure>
<table>
  <thead>
    <tr>
      <th>Unique ID</th>
      <th>Title</th>
      <th>Year</th>
      <th>Intervention</th>
      <th>Effect sizes</th>
      <th>Reviews</th>
      <th>Checked out</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for p in papers %}
      <tr>
        <td><strong>{{ p.unique_id }}</strong></td>
        <td>
          {{ p.title|truncate(80) }}
          {% if p.authors %}<br><small class="muted">{{ p.authors|truncate(60) }}</small>{% endif %}
        </td>
        <td>{{ p.year }}</td>
        <td>{{ p.intervention_category|truncate(40) }}</td>
        <td>{{ es_counts.get(p.unique_id, 0) }}</td>
        <td>
          {% set reviewers = review_emails.get(p.unique_id, []) %}
          {% if reviewers|length >= max_reviewers %}
            <span class="badge badge-confirmed" title="{{ reviewers|join(', ') }}">{{ reviewers|length }}/{{ max_reviewers }}</span>
          {% elif reviewers %}
            <span class="badge badge-modified" title="{{ reviewers|join(', ') }}">{{ reviewers|length }}/{{ max_reviewers }}</span>
          {% else %}
            <span class="muted">0/{{ max_reviewers }}</span>
          {% endif %}
        </td>
        <td>
          {% if p.checked_out_by %}
            {% if p.checked_out_by == me %}
              <span class="badge badge-mine" title="Checked out at {{ p.checked_out_at }}">you</span>
            {% else %}
              <span class="badge badge-held" title="Checked out at {{ p.checked_out_at }}">{{ p.checked_out_by }}</span>
            {% endif %}
          {% else %}
            <span class="muted">—</span>
          {% endif %}
        </td>
        <td>
          {% if p.status.value == "modified" %}<span class="badge badge-modified">edited</span>{% endif %}
          {% if p.needs_reextraction or p.unique_id in papers_needing_reextract %}<span class="badge badge-reextract">re-extract</span>{% endif %}
        </td>
        <td>
          {% if p.checked_out_by == me %}
            <div class="row-actions" style="justify-content:flex-end">
              <a href="/papers/{{ p.unique_id }}" role="button">Continue draft</a>
              <form method="post" action="/papers/{{ p.unique_id }}/checkin" style="margin:0"
                    onsubmit="return confirm('Release this paper so someone else can review it?\n\nYour edits stay, but you will NOT be recorded as a reviewer. Only click Release if you are not going to work on this paper anymore.');">
                <button type="submit" class="secondary outline" title="Hand this paper back to the pool. Only release if you are done with it.">Release</button>
              </form>
            </div>
          {% elif p.checked_out_by %}
            {% if request.session.get('is_admin') %}
              <a href="/papers/{{ p.unique_id }}" role="button" class="outline">View as admin</a>
            {% else %}
              <span class="muted">locked</span>
            {% endif %}
          {% else %}
            <form method="post" action="/papers/{{ p.unique_id }}/checkout" style="margin:0">
              <button type="submit">Check out</button>
            </form>
          {% endif %}
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
</figure>
{% endblock %}
