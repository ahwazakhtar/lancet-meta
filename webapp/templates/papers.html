{% extends "base.html" %}
{% block title %}Papers · Lancet Meta Review{% endblock %}
{% block content %}

{% if msg %}<p class="msg-success">{{ msg }}</p>{% endif %}
{% if err %}<p class="msg-error">{{ err }}</p>{% endif %}

<div class="flex-row" style="align-items:flex-end;">
  <hgroup>
    <h2>Papers</h2>
    <p>{{ papers|length }} paper(s) visible. Check a paper out before editing it.</p>
  </hgroup>
  <form method="post" action="/refresh-from-sheet" style="margin:0;"
        onsubmit="return confirm('Refresh papers from the Google Sheet?\n\nThis replaces every paper EXCEPT any that someone has checked out.');">
    <button type="submit" class="outline">↻ Refresh from Sheet</button>
  </form>
</div>

<form method="get" action="/" role="search">
  <div class="grid">
    <input type="search" name="q" value="{{ q }}" placeholder="Search by unique ID, authors, intervention, title…">
    <select name="status_filter">
      <option value="">All statuses</option>
      {% for s in statuses %}
        <option value="{{ s }}" {% if status_filter == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
    <select name="checkout_filter">
      <option value="">Any checkout state</option>
      <option value="mine" {% if checkout_filter == 'mine' %}selected{% endif %}>Checked out by me</option>
      <option value="held" {% if checkout_filter == 'held' %}selected{% endif %}>Checked out (anyone)</option>
      <option value="available" {% if checkout_filter == 'available' %}selected{% endif %}>Available</option>
    </select>
    <button type="submit">Filter</button>
  </div>
</form>

<figure>
<table>
  <thead>
    <tr>
      <th>Unique ID</th>
      <th>Title</th>
      <th>Year</th>
      <th>Intervention</th>
      <th>Effect sizes</th>
      <th>Checked out</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for p in papers %}
      <tr>
        <td><strong>{{ p.unique_id }}</strong></td>
        <td>
          {{ p.title|truncate(80) }}
          {% if p.authors %}<br><small class="muted">{{ p.authors|truncate(60) }}</small>{% endif %}
        </td>
        <td>{{ p.year }}</td>
        <td>{{ p.intervention_category|truncate(40) }}</td>
        <td>{{ es_counts.get(p.unique_id, 0) }}</td>
        <td>
          {% if p.checked_out_by %}
            {% if p.checked_out_by == me %}
              <span class="badge badge-mine" title="Checked out at {{ p.checked_out_at }}">you</span>
            {% else %}
              <span class="badge badge-held" title="Checked out at {{ p.checked_out_at }}">{{ p.checked_out_by }}</span>
            {% endif %}
          {% else %}
            <span class="muted">—</span>
          {% endif %}
        </td>
        <td>
          <span class="badge badge-{{ p.status.value }}">{{ p.status.value }}</span>
          {% if p.needs_reextraction %}<span class="badge badge-reextract">re-extract</span>{% endif %}
        </td>
        <td><a href="/papers/{{ p.unique_id }}" role="button" class="outline">Review</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
</figure>
{% endblock %}
