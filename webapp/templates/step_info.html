{% extends "paper_review.html" %}
{% block step_content %}

<section>
  <hgroup>
    <h3>Paper-level fields</h3>
    <p>Bibliographic + study-level metadata. Edits here apply to the paper as a whole.</p>
  </hgroup>

  <form method="post" action="/papers/{{ paper.unique_id }}/edit">
    <fieldset {% if not can_edit %}disabled{% endif %}>
      <div class="field-grid">
        {% for field in paper_fields %}
          <label>
            <span class="field-label">{{ field.replace("_", " ") }}</span>
            {% set val = paper[field] %}
            {% if val and val|length > 80 %}
              <textarea name="{{ field }}" rows="3">{{ val }}</textarea>
            {% else %}
              <input type="text" name="{{ field }}" value="{{ val or '' }}">
            {% endif %}
          </label>
        {% endfor %}
      </div>
      <label>
        <span class="field-label">Reviewer notes (paper)</span>
        <textarea name="reviewer_notes" rows="2">{{ paper.reviewer_notes }}</textarea>
      </label>
      <label>
        <input type="checkbox" name="needs_reextraction" {% if paper.needs_reextraction %}checked{% endif %}>
        Flag this paper for re-extraction
      </label>
      <div class="row-actions">
        <button type="submit">Save paper edits</button>
        <button type="submit" formaction="/papers/{{ paper.unique_id }}/confirm" class="contrast">Confirm paper</button>
        <button type="submit" formaction="/papers/{{ paper.unique_id }}/delete" class="secondary outline"
                onclick="return confirm('Delete this paper extraction?');">Delete</button>
      </div>
    </fieldset>
  </form>
</section>

{% endblock %}
